<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081018" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <title>Updating RigCheck…</title>
  <style>
    html,body{height:100%;margin:0;background:#081018;color:#eaf6ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{text-align:center;max-width:420px}
    h1{font-size:24px;margin:0 0 10px}p{opacity:.72;line-height:1.45;margin:0}
    .dot{width:12px;height:12px;border-radius:50%;background:#53dfff;margin:24px auto;animation:pulse .8s ease-in-out infinite alternate}
    @keyframes pulse{to{transform:scale(1.7);opacity:.4}}
  </style>
</head>
<body>
  <main>
    <h1>Updating RigCheck…</h1>
    <div class="dot" aria-hidden="true"></div>
    <p>Clearing the old app shell and loading the newest build.</p>
  </main>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('rigcheck-')).map((key) => caches.delete(key)));
        }
      } catch (error) {
        console.warn('RigCheck refresh cleanup skipped', error);
      }
      const target = new URL('./', window.location.href);
      target.searchParams.set('fresh', String(Date.now()));
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>

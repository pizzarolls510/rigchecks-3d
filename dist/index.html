<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#081018" />
    <meta name="description" content="Inspect GLB animations and static poses on any device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RigCheck" />
    <title>RigCheck 3D</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./patch-v02.css" />
    <link rel="stylesheet" href="./firebase-auth.css" />
    <link rel="stylesheet" href="./cloud-library.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="RigCheck 3D">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>RigCheck <b>3D</b></span>
          <span class="version">PREVIEW 0.4.2</span>
        </div>
        <div class="top-actions">
          <button class="button ghost" id="installButton" type="button" hidden>Install</button>
          <label class="button primary" for="fileInput">Open model</label>
          <input id="fileInput" type="file" accept=".glb,.gltf,.bin,image/*,.ktx2,.basis" multiple hidden />
        </div>
      </header>

      <main class="workspace">
        <section class="stage" id="dropZone" aria-label="3D model viewport">
          <canvas id="viewport"></canvas>

          <div class="stage-status">
            <span class="eyebrow" id="sourceLabel">BUILT-IN SAMPLE</span>
            <strong id="modelLabel">Motion rig</strong>
          </div>

          <div class="view-actions" aria-label="Camera controls">
            <button class="icon-button" id="fitButton" type="button" title="Fit model">Fit</button>
            <button class="icon-button" id="fullscreenButton" type="button" title="Full screen">Full</button>
          </div>

          <div class="drop-prompt" id="dropPrompt" hidden>
            <strong>Drop your model here</strong>
            <span>GLB works best</span>
          </div>

          <div class="transport" aria-label="Animation playback">
            <div class="transport-row">
              <button class="transport-button" id="previousFrame" type="button" aria-label="Previous frame">−1</button>
              <button class="play-button" id="playButton" type="button" aria-label="Pause animation">Pause</button>
              <button class="transport-button" id="nextFrame" type="button" aria-label="Next frame">+1</button>
              <span class="timecode" id="timecode">00:00 / 00:00</span>
            </div>
            <input class="timeline" id="timeline" type="range" min="0" max="1000" value="0" aria-label="Animation timeline" />
          </div>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </section>

        <aside class="inspector" aria-label="Animation and pose inspector">
          <section class="panel-section clip-section">
            <div class="section-heading">
              <span>Motion / Pose</span>
              <span class="privacy-pill">Local only</span>
            </div>
            <label class="field-label" for="clipSelect">Clip or pose</label>
            <select id="clipSelect" class="select"></select>

            <div class="field-row">
              <label class="field-label" for="speedRange">Speed</label>
              <output id="speedValue">1.0×</output>
            </div>
            <input class="range" id="speedRange" type="range" min="0.1" max="2" step="0.1" value="1" />
          </section>

          <section class="panel-section">
            <div class="section-heading"><span>Inspect</span></div>
            <div class="toggle-grid">
              <label class="toggle"><input id="loopToggle" type="checkbox" checked /><span></span>Loop</label>
              <label class="toggle"><input id="skeletonToggle" type="checkbox" /><span></span>Skeleton</label>
              <label class="toggle"><input id="gridToggle" type="checkbox" checked /><span></span>Grid</label>
              <label class="toggle"><input id="rotateToggle" type="checkbox" /><span></span>Auto rotate</label>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-heading"><span>Camera</span></div>
            <div class="preset-grid">
              <button data-view="front" type="button">Front</button>
              <button data-view="side" type="button">Side</button>
              <button data-view="top" type="button">Top</button>
              <button data-view="iso" type="button">Game angle</button>
            </div>
          </section>

          <section class="panel-section stats-section">
            <div class="section-heading"><span>Asset</span></div>
            <dl class="stats">
              <div><dt>Triangles</dt><dd id="trianglesStat">—</dd></div>
              <div><dt>Meshes</dt><dd id="meshesStat">—</dd></div>
              <div><dt>Bones</dt><dd id="bonesStat">—</dd></div>
              <div><dt>Clips</dt><dd id="clipsStat">—</dd></div>
              <div><dt>Size</dt><dd id="sizeStat">Sample</dd></div>
              <div><dt>FPS</dt><dd id="fpsStat">—</dd></div>
            </dl>
          </section>

          <section class="panel-section action-section">
            <button class="button secondary wide" id="screenshotButton" type="button">Capture frame</button>
            <label class="remember-row">
              <input id="rememberToggle" type="checkbox" checked />
              Remember latest GLB on this device
            </label>
            <button class="text-button" id="forgetButton" type="button">Forget saved model</button>
          </section>

          <p class="install-hint" id="iosInstallHint">On iPhone: Share → Add to Home Screen</p>
        </aside>
      </main>
    </div>

    <script src="./update-manager.js"></script>
    <script type="module" src="./app.js"></script>
    <script src="./patch-v02.js"></script>
    <script src="./firebase-auth.js"></script>
    <script type="module" src="./cloud-library.js"></script>
  </body>
</html>
